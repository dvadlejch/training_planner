repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --extra dev ruff check src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --extra dev ruff format --check src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Mypy
        entry: uv run --extra dev mypy src tests
        language: system
        pass_filenames: false
        always_run: true
